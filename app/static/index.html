<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliUp</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; } main { width: min(680px, calc(100% - 32px)); margin: 12vh auto; }
    h1 { margin-bottom: 6px; } p { color: #667085; } .search { display: flex; gap: 10px; margin: 28px 0 16px; }
    input { flex: 1; padding: 12px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit; }
    button { padding: 11px 16px; border: 0; border-radius: 8px; background: #2156d9; color: white; font: inherit; cursor: pointer; }
    button:disabled { background: #98a2b3; cursor: default; } #results { max-height: 330px; overflow-y: auto; padding-right: 4px; scrollbar-gutter: stable; } .result { display: block; box-sizing: border-box; width: 100%; margin: 0 0 10px; padding: 14px; text-align: left; background: white; border: 1px solid #e4e7ec; color: #172033; }
    .result:last-child { margin-bottom: 0; } .result.selected { border: 2px solid #2156d9; } .meta { display: -webkit-box; margin-top: 5px; overflow: hidden; color: #667085; font-size: 14px; -webkit-box-orient: vertical; -webkit-line-clamp: 2; } .actions { margin: 0 0 12px; } #message { min-height: 24px; margin-top: 16px; } .error { color: #b42318; } .success { color: #027a48; }
    .runtime { margin: 20px 0; padding: 14px; border-radius: 8px; background: #eef4ff; color: #3538cd; } .runtime.error { background: #fef3f2; color: #b42318; } .runtime code { display: block; margin: 10px 0; user-select: all; } .runtime a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>BiliUp</h1>
    <p>搜索并登记 B 站 UP 主</p>
    <section id="setup" class="runtime" aria-live="polite">
      <strong>设置视频知识库</strong>
      <p>首次使用请选择一个用于保存视频与 UP 登记信息的目录。</p>
      <button id="select-library" disabled>选择视频知识库目录</button>
      <div id="setup-message"></div>
    </section>
    <section id="dashboard" hidden>
      <div id="runtime" class="runtime">正在检查 OpenCLI…</div>
      <div class="search"><input id="query" placeholder="输入 UP 主昵称" autocomplete="off" disabled><button id="search" disabled>搜索</button></div>
      <div class="actions"><button id="save" disabled>确认写入</button></div>
      <section id="results" aria-live="polite"></section>
      <div id="message" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const setup = document.querySelector('#setup'), setupMessage = document.querySelector('#setup-message'), selectLibrary = document.querySelector('#select-library'), dashboard = document.querySelector('#dashboard'), query = document.querySelector('#query'), search = document.querySelector('#search'), results = document.querySelector('#results'), save = document.querySelector('#save'), message = document.querySelector('#message'), runtime = document.querySelector('#runtime');
    let selected = null, runtimeReady = false;
    function show(text, kind = '') { message.textContent = text; message.className = kind; }
    function showSetup(text, kind = '') { setupMessage.textContent = text; setupMessage.className = kind; }
    function setSearching(searching) { search.disabled = searching || !runtimeReady; search.textContent = searching ? '搜索中…' : '搜索'; }
    async function responseData(response) { const text = await response.text(); try { return JSON.parse(text); } catch (_) { throw new Error(response.ok ? '服务返回的数据格式不正确' : '服务请求失败，请重试'); } }
    function showDashboard() { setup.hidden = true; dashboard.hidden = false; checkRuntime(); }
    async function runSearch() {
      const nickname = query.value.trim(); selected = null; save.disabled = true; results.innerHTML = '';
      if (!nickname) { setSearching(false); return; }
      setSearching(true);
      show('搜索中…');
      try {
        const response = await fetch('/api/up-search', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nickname}) });
        const data = await responseData(response); if (!response.ok) throw new Error(data.detail || '搜索失败');
        if (!data.length) { show('未找到匹配的 UP 主'); return; }
        show(''); data.forEach(item => { const button = document.createElement('button'); button.className = 'result'; button.innerHTML = `<strong>${escapeHtml(item.nickname)}</strong><span class="meta">UP ID：${escapeHtml(item.uid)} · ${escapeHtml(item.bio || '-')}</span>`; button.onclick = () => { document.querySelectorAll('.result').forEach(node => node.classList.remove('selected')); button.classList.add('selected'); selected = item; save.disabled = false; show(''); }; results.append(button); });
      } catch (error) { show(error.message, 'error'); }
      finally { setSearching(false); }
    }
    function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
    async function checkRuntime() { try { const response = await fetch('/api/runtime-status'); const status = await responseData(response); runtimeReady = Boolean(status.ready); setSearching(false); query.disabled = !runtimeReady; runtime.textContent = status.message; if (!status.ready) { runtime.classList.add('error'); if (!status.installed) { const command = document.createElement('code'); command.textContent = 'npm install -g @jackwener/opencli'; runtime.append(command); const link = document.createElement('a'); link.href = 'https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk'; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = '安装 OpenCLI Chrome 扩展'; runtime.append(link); } } } catch (_) { runtimeReady = false; setSearching(false); query.disabled = true; runtime.textContent = '无法检查 OpenCLI 运行环境'; runtime.classList.add('error'); } }
    async function checkSetup() { try { const response = await fetch('/api/setup-status'); const status = await responseData(response); if (status.configured) { showDashboard(); return; } showSetup(status.message); selectLibrary.disabled = false; } catch (error) { showSetup(error.message, 'error'); } }
    async function selectKnowledgeBase() { selectLibrary.disabled = true; selectLibrary.textContent = '正在打开目录选择器…'; showSetup(''); try { const response = await fetch('/api/setup/select-library', { method: 'POST' }); const data = await responseData(response); if (!response.ok) throw new Error(data.detail || '设置失败'); if (data.cancelled) { showSetup(data.message); return; } showDashboard(); } catch (error) { showSetup(error.message, 'error'); } finally { if (!setup.hidden) { selectLibrary.disabled = false; selectLibrary.textContent = '选择视频知识库目录'; } } }
    search.onclick = runSearch;
    save.onclick = async () => { if (!selected) return; save.disabled = true; try { const response = await fetch('/api/followings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(selected) }); const data = await responseData(response); if (!response.ok) throw new Error(data.detail || '写入失败'); show(data.action === 'created' ? '已新增' : '已更新', 'success'); } catch (error) { show(error.message, 'error'); } finally { save.disabled = !selected; } };
    selectLibrary.onclick = selectKnowledgeBase;
    checkSetup();
  </script>
</body>
</html>
