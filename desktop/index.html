<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliUp</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f3f4f6; color: #1f2937; }
    main { width: min(520px, calc(100% - 32px)); padding: 32px; border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; box-shadow: 0 12px 36px rgba(15, 23, 42, 0.1); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: #6b7280; line-height: 1.6; }
    .spinner { width: 34px; height: 34px; margin: 24px auto; border: 4px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .error { color: #b42318; white-space: pre-wrap; }
    .path { display: block; margin-top: 12px; padding: 8px; border-radius: 6px; background: #f9fafb; color: #4b5563; font: 12px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <h1>BiliUp</h1>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <p id="message" aria-live="polite">正在启动本地服务…</p>
    <code id="path" class="path" hidden></code>
  </main>
  <script>
    window.showError = function showError(message, configPath) {
      document.querySelector('#spinner').hidden = true;
      const messageElement = document.querySelector('#message');
      messageElement.className = 'error';
      messageElement.textContent = message;
      const pathElement = document.querySelector('#path');
      pathElement.textContent = configPath;
      pathElement.hidden = !configPath;
    };
  </script>
</body>
</html>
